<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myaku — Journal</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="journal">
  <div class="app-shell">
    <div id="nav-root"></div>
    <main class="main">
      <div class="page-header">
        <div class="page-eyebrow" id="journal-date-label">Journal</div>
        <h1>Journal</h1>
        <p class="page-intro">Write freely about how today actually went.</p>
      </div>

      <div class="card">
        <textarea id="journal-entry" class="note-input" style="min-height: 160px;" placeholder="What stood out about today?"></textarea>
        <div style="display: flex; align-items: center; gap: 14px; margin-top: 14px;">
          <button class="btn btn-primary" id="journal-save">Save Entry</button>
          <span class="empty-note" id="journal-saved-note" style="display: none;">Saved</span>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">Past Entries</div>
        <div id="journal-past"></div>
      </div>
    </main>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/session.js"></script>
  <script src="js/journal.js"></script>
</body>
</html>

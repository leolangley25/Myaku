<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Myaku — Create Account</title>
  <meta name="theme-color" content="#f3edf7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#211f26" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Myaku" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body style="padding-bottom:0;">
  <div class="screen" style="max-width:420px;padding-top:10vh;">
    <h1 class="large-title">Create Account</h1>
    <p class="nav-sub" style="margin-bottom:26px;">Private by default, and no coach ever sees this.</p>

    <form id="form">
      <label class="sr-only" for="name">Name</label>
      <input class="field" id="name" placeholder="Name" autocomplete="name" required />
      <label class="sr-only" for="email">Email</label>
      <input class="field" id="email" type="email" placeholder="Email" autocomplete="email" required style="margin-top:12px;" />
      <label class="sr-only" for="password">Password</label>
      <input class="field" id="password" type="password" placeholder="Password" autocomplete="new-password" required style="margin-top:12px;" />
      <p class="footnote secondary" style="margin-top:10px;padding:0 4px;">At least eight characters.</p>
      <p class="footnote" style="color:var(--error);margin-top:12px;" id="error" role="alert" hidden></p>
      <button class="btn btn-filled btn-block" type="submit" style="margin-top:24px;">Continue</button>
    </form>

    <a class="btn btn-tinted btn-block" href="login.html" style="margin-top:12px;">Sign In Instead</a>
  </div>

  <script src="js/motion.js"></script>
  <script src="js/explain.js"></script>
  <script src="js/core.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myaku — Create Account</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">Myaku</div>
      <h1>Create Account</h1>
      <p class="page-intro">Set up your private, athlete-owned Myaku account.</p>

      <form id="signup-form">
        <label class="field-label" for="name">Name</label>
        <input type="text" id="name" class="field-input" autocomplete="name" required />

        <label class="field-label" for="email">Email</label>
        <input type="email" id="email" class="field-input" autocomplete="email" required />

        <label class="field-label" for="password">Password</label>
        <input type="password" id="password" class="field-input" autocomplete="new-password" required />

        <p class="form-error" id="signup-error" style="display: none;"></p>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 18px;">Create Account</button>
      </form>

      <a href="login.html" class="muted-link" style="display: block; text-align: center; margin-top: 18px;">Log In Instead</a>
    </div>
  </main>

  <script src="js/auth-pages.js"></script>
</body>
</html>

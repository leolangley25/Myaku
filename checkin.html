<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myaku — Weekly Check-In</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="checkin">
  <div class="app-shell">
    <div id="nav-root"></div>
    <main class="main">
      <div class="page-header">
        <div class="page-eyebrow">Check-In</div>
        <h1>Weekly Check-In</h1>
        <p class="page-intro">Rate how each part of your week actually felt.</p>
      </div>

      <div class="card" id="checkin-form">
        <div id="domains-container"></div>
        <button class="btn btn-primary btn-block" id="submit-checkin" style="margin-top: 6px;">Submit Check-In</button>
        <p class="empty-note" id="checkin-error" style="display: none; margin-top: 10px;">Please answer all three before submitting.</p>
      </div>

      <div class="card" id="checkin-confirmation" style="display: none; text-align: center;">
        <div class="experiment-title" style="margin-bottom: 6px;">Check-In Complete</div>
        <p class="page-intro" style="margin: 0 auto;">Your reflection has been added to this week's data.</p>
        <a href="index.html" class="btn btn-secondary" style="margin-top: 18px;">Back to Dashboard</a>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

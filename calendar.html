<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myaku — Calendar</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="calendar">
  <div class="app-shell">
    <div id="nav-root"></div>
    <main class="main">
      <div class="page-header">
        <div class="page-eyebrow">Calendar</div>
        <h1>Calendar</h1>
        <p class="page-intro">Import your calendar to see how your schedule lines up with your data.</p>
      </div>

      <div class="card" id="calendar-connect-card">
        <label class="field-label" for="calendar-url">Calendar URL</label>
        <input type="text" id="calendar-url" class="field-input" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics" />
        <p class="empty-note" style="margin-top: 8px;">Most calendar apps offer a private iCal link under sharing settings.</p>
        <p class="form-error" id="calendar-error" style="display: none;"></p>
        <button class="btn btn-primary" id="calendar-import" style="margin-top: 16px;">Import Calendar</button>
      </div>

      <div id="calendar-connected" style="display: none;">
        <div class="card-row" style="margin-top: 16px;">
          <div class="card">
            <div class="card-label">Imported Events</div>
            <div class="score-display">
              <span class="score-number" id="calendar-event-count">0</span>
            </div>
            <p class="page-intro" id="calendar-source-note" style="margin-top: 10px;"></p>
            <a href="#" class="muted-link" id="calendar-disconnect" style="display: inline-block; margin-top: 10px;">Remove Calendar</a>
          </div>
          <div class="card">
            <div class="card-label">Schedule Load This Week</div>
            <div id="calendar-daily-load"></div>
          </div>
        </div>

        <div id="calendar-insight"></div>

        <div class="section-block">
          <div class="section-title">Upcoming Events</div>
          <div id="calendar-upcoming"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/session.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>

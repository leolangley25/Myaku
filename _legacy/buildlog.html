<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myaku — Build Log</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="buildlog">
  <div class="app-shell">
    <div id="nav-root"></div>
    <main class="main">
      <div class="page-header">
        <div class="page-eyebrow">Build Log</div>
        <h1>Build Log</h1>
        <p class="page-intro">This documents the real decisions behind building Myaku.</p>
      </div>

      <div class="card">
        <div id="buildlog-list"></div>
      </div>

      <div class="section-block">
        <div class="section-title">Resume Summary</div>
        <p class="page-intro" style="margin-bottom: 14px;">Ready-made bullet points, pulled directly from this build log.</p>
        <div class="card">
          <div class="resume-block" id="resume-block"></div>
          <button class="btn btn-secondary copy-btn" id="copy-resume">Copy Bullets</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

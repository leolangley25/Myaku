<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Myaku — Calibrate</title>
  <meta name="theme-color" content="#f3edf7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#211f26" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Myaku" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body style="padding-bottom:0;">
  <div class="screen">
    <header class="nav-large" style="padding-top:8vh;">
      <h1 class="large-title">Calibrate</h1>
      <p class="nav-sub">This gives the psychological channel a reference point today, instead of waiting a month to build one.</p>
    </header>

    <section class="section">
      <div class="card">
        <label class="field-label" for="sport" style="margin-top:0;">Sport</label>
        <input class="field" id="sport" placeholder="Soccer" style="background:var(--fill-2);" />
        <label class="field-label" for="training-days">Training Days Per Week</label>
        <input class="field" id="training-days" type="number" min="0" max="7" placeholder="5" style="background:var(--fill-2);" />
        <label class="field-label" for="bedtime">Typical Bedtime</label>
        <input class="field" id="bedtime" type="time" style="background:var(--fill-2);" />
      </div>
    </section>

    <section class="section">
      <div class="section-header">Usual Levels</div>
      <div id="baselines"></div>
    </section>

    <section class="section">
      <button class="btn btn-filled btn-block" id="save">Save And Continue</button>
      <a class="btn btn-gray btn-block" href="index.html" style="margin-top:12px;">Skip For Now</a>
    </section>

    <div style="height:32px;"></div>
  </div>

  <script src="js/motion.js"></script>
  <script src="js/explain.js"></script>
  <script src="js/core.js"></script>
  <script src="js/calibrate.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myaku — High-Load Periods</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="season">
  <div class="app-shell">
    <div id="nav-root"></div>
    <main class="main">
      <div class="page-header">
        <div class="page-eyebrow">Periods</div>
        <h1>High-Load Periods</h1>
        <p class="page-intro">Mark the stretches when your normal thresholds don't quite apply.</p>
      </div>

      <div class="card">
        <label class="field-label" for="phase-label">Label</label>
        <input type="text" id="phase-label" class="field-input" placeholder="e.g. Finals Week, Playoffs" />

        <label class="field-label" for="phase-start">Start Date</label>
        <input type="date" id="phase-start" class="field-input" />

        <label class="field-label" for="phase-end">End Date</label>
        <input type="date" id="phase-end" class="field-input" />

        <p class="form-error" id="phase-error" style="display: none;"></p>

        <button class="btn btn-primary" id="phase-add" style="margin-top: 16px;">Add Period</button>
      </div>

      <div class="section-block">
        <div class="section-title">Marked Periods</div>
        <div id="phase-list"></div>
      </div>
    </main>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/session.js"></script>
  <script src="js/season.js"></script>
</body>
</html>
